name: Release InboxBridge

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    name: Validate tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract and validate version
        id: version
        run: |
          CARGO_VERSION=$(grep '^version' inboxbridge/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag v$TAG_VERSION doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows
    needs: validate-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: inboxbridge
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        working-directory: inboxbridge
        run: iscc installer\windows\inboxbridge.iss /dBinaryDir=..\..\target\release /dAppVersion=${{ needs.validate-version.outputs.version }}
        shell: cmd

      - name: Create portable zip
        working-directory: inboxbridge
        run: |
          mkdir portable
          cp target/release/inboxbridge.exe portable/
          cp installer/windows/install.ps1 portable/
          Compress-Archive -Path portable/* -DestinationPath "InboxBridge-v${{ needs.validate-version.outputs.version }}-windows-x64.zip"
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: inboxbridge/installer/windows/Output/*.exe

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: inboxbridge/InboxBridge-*.zip

  build-macos:
    name: Build macOS
    needs: validate-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build Intel
        working-directory: inboxbridge
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build ARM
        working-directory: inboxbridge
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        working-directory: inboxbridge
        run: |
          mkdir -p target/universal
          lipo -create \
            target/x86_64-apple-darwin/release/inboxbridge \
            target/aarch64-apple-darwin/release/inboxbridge \
            -output target/universal/inboxbridge

      - name: Build PKG installer
        working-directory: inboxbridge
        run: |
          chmod +x installer/macos/build-pkg.sh
          ./installer/macos/build-pkg.sh target/universal/inboxbridge ${{ needs.validate-version.outputs.version }}

      - name: Create portable tar.gz
        working-directory: inboxbridge
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          mkdir -p portable
          cp target/universal/inboxbridge portable/
          cp installer/macos/install-macos.sh portable/
          chmod +x portable/inboxbridge portable/install-macos.sh
          tar -czf "InboxBridge-v${VERSION}-macos-universal.tar.gz" -C portable .

      - name: Upload PKG
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: inboxbridge/InboxBridge-*.pkg

      - name: Upload portable tar.gz
        uses: actions/upload-artifact@v7
        with:
          name: macos-portable
          path: inboxbridge/InboxBridge-*-macos-*.tar.gz

  build-linux:
    name: Build Linux
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        working-directory: inboxbridge
        run: cargo build --release

      - name: Create portable tar.gz
        working-directory: inboxbridge
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          mkdir -p portable
          cp target/release/inboxbridge portable/
          cp installer/linux/install-linux.sh portable/
          cp installer/linux/README.txt portable/
          chmod +x portable/inboxbridge portable/install-linux.sh
          tar -czf "InboxBridge-v${VERSION}-linux-x64.tar.gz" -C portable .

      - name: Upload portable tar.gz
        uses: actions/upload-artifact@v7
        with:
          name: linux-portable
          path: inboxbridge/InboxBridge-*-linux-*.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [validate-version, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.pkg' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > checksums.sha256

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Mirror the old softprops/action-gh-release fail_on_unmatched_files
          # behavior: abort before touching GitHub if the glob expands to zero.
          shopt -s nullglob
          files=(release/*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No files matched release/* -- refusing to touch the release" >&2
            exit 1
          fi

          # Body template is transcribed verbatim from the prior
          # softprops/action-gh-release@v2 step. Kept inline as a heredoc so
          # the release metadata stays self-contained in this workflow file.
          # Note: escape $ in dollar amounts so the shell does not expand them.
          cat > release-notes.md <<EOF
          ## InboxBridge v${VERSION}

          Companion app for the [InboxKey](https://github.com/slmnsrf/inboxkey) Chrome extension. Required for every IMAP mailbox InboxKey connects to (Gmail via App Password, Outlook, Yahoo, Fastmail, ProtonMail Bridge, self-hosted, and others). Runs locally on the device. No data leaves the machine.

          ### Download

          | Platform | Installer (recommended) | Portable |
          |----------|------------------------|----------|
          | **Windows** (x64) | \`.exe\` | \`.zip\` |
          | **macOS** (Intel + Apple Silicon) | \`.pkg\` | \`.tar.gz\` |
          | **Linux** (x64) | -- | \`.tar.gz\` |

          ### Installation

          **Windows**
          1. Download the \`.exe\` file
          2. Run it. You may see a "Windows protected your PC" warning (see below). Click "More info", then "Run anyway"
          3. Follow the installer. It installs to your user folder, no admin needed
          4. Close **all** Chrome windows and reopen Chrome
          5. Open InboxKey settings and add an IMAP account

          **macOS**
          1. Download the \`.pkg\` file
          2. Right-click it, click "Open", then "Open" again in the dialog (see below)
          3. Follow the installer
          4. Quit Chrome completely (Cmd+Q) and reopen it
          5. Open InboxKey settings and add an IMAP account

          **Linux**
          1. Download the \`.tar.gz\` file
          2. Extract: \`tar xzf InboxBridge-*.tar.gz\`
          3. Run: \`chmod +x install-linux.sh && ./install-linux.sh\`
          4. Close all browser windows and reopen
          5. Open InboxKey settings and add an IMAP account

          ### About the unsigned software warning

          InboxBridge is not digitally signed because code signing certificates cost \$200-500/year, which this project cannot afford.

          **Windows:** You may see "Windows protected your PC." Click "More info", then "Run anyway."

          **macOS:** You may see "unidentified developer." Right-click the file, click "Open", then "Open" again.

          The app is 100% source-available. You can review every line of code in [the repository](https://github.com/slmnsrf/inboxkey/tree/main/inboxbridge).
          EOF

          # Idempotent upsert. softprops/action-gh-release updated existing
          # releases in place; gh release create errors on conflict, so we
          # branch. First run -> create. Rerun path (partial or full) ->
          # edit metadata + re-upload assets with --clobber to replace any
          # stale partial files left behind by a failed prior run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating in place"
            gh release edit "$TAG" \
              --title "InboxBridge v${VERSION}" \
              --notes-file release-notes.md
            gh release upload "$TAG" \
              --clobber \
              "${files[@]}"
          else
            echo "Release $TAG does not exist; creating"
            gh release create "$TAG" \
              --title "InboxBridge v${VERSION}" \
              --notes-file release-notes.md \
              --verify-tag \
              "${files[@]}"
          fi
