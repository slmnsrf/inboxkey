name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: production

      - name: Build extension
        run: npm run build
        env:
          NODE_ENV: production

      - name: Generate checksums
        run: |
          cd build/chrome-mv3-prod
          find . -type f -exec sha256sum {} \; | sort -k 2 > SHA256SUMS
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS

      - name: Create build info
        run: |
          cat > build/chrome-mv3-prod/BUILD_INFO.txt <<EOF
          InboxKey Build Information
          ==========================

          Version: ${{ github.event.inputs.tag_name || github.ref_name }}
          Commit: ${{ github.sha }}
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Build Environment:
          - Node.js: $(node --version)
          - npm: $(npm --version)
          - OS: Ubuntu (GitHub Actions)

          Build Command: npm ci && npm run build

          Verification:
          1. Clone repo: git clone https://github.com/${{ github.repository }}.git
          2. Checkout tag: git checkout ${{ github.event.inputs.tag_name || github.ref_name }}
          3. Build: npm ci && npm run build
          4. Compare checksums with SHA256SUMS file

          For detailed verification instructions, see:
          https://github.com/${{ github.repository }}/blob/main/README.md#-build-verification
          EOF
          cat build/chrome-mv3-prod/BUILD_INFO.txt

      - name: Create release archive
        run: |
          cd build
          zip -r ../inboxkey-${{ github.event.inputs.tag_name || github.ref_name }}.zip chrome-mv3-prod/
          cd ..
          sha256sum inboxkey-${{ github.event.inputs.tag_name || github.ref_name }}.zip > inboxkey-${{ github.event.inputs.tag_name || github.ref_name }}.zip.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: |
            build/chrome-mv3-prod/
            inboxkey-*.zip
            inboxkey-*.zip.sha256
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event.inputs.tag_name
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            inboxkey-*.zip
            inboxkey-*.zip.sha256
            build/chrome-mv3-prod/SHA256SUMS
            build/chrome-mv3-prod/BUILD_INFO.txt
          body: |
            ## 🔒 Build Verification

            This release was built automatically via GitHub Actions from commit ${{ github.sha }}.

            **Build Environment:**
            - Node.js: 20.19.5
            - npm: 10.8.2
            - OS: Ubuntu (GitHub Actions)

            **Verify the build:**
            1. Download `SHA256SUMS` and `BUILD_INFO.txt` from this release
            2. Compare checksums with your local build or Chrome Web Store version
            3. See full verification guide in [README.md](https://github.com/${{ github.repository }}/blob/main/README.md#-build-verification)

            **Files:**
            - `inboxkey-${{ github.event.inputs.tag_name || github.ref_name }}.zip` - Complete extension build
            - `SHA256SUMS` - Checksums for all built files
            - `BUILD_INFO.txt` - Detailed build information

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
