<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A91FF"/>
      <stop offset="100%" stop-color="#0066D6"/>
    </linearGradient>
  </defs>
  <!-- iOS-style rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Key silhouette - bold, readable at all sizes -->
  <g fill="white" transform="translate(256, 256)">
    <!-- Key bow (head) - thick ring -->
    <circle cx="0" cy="-80" r="72"/>
    <circle cx="0" cy="-80" r="32" fill="url(#bg)"/>
    <!-- Key blade (shaft) -->
    <rect x="-18" y="-26" width="36" height="180" rx="4"/>
    <!-- Ward (bottom teeth) -->
    <rect x="-18" y="100" width="68" height="28" rx="4"/>
    <rect x="-18" y="138" width="52" height="24" rx="4"/>
  </g>
</svg>
