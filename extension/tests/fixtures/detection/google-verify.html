<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Step Verification - Google Accounts</title>
  <style>
    body { font-family: 'Google Sans', Roboto, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f8f9fa; margin: 0; }
    .card { background: #fff; padding: 48px 40px 36px; border-radius: 8px; box-shadow: 0 1px 3px rgba(60,64,67,0.3); max-width: 450px; }
    .logo { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 400; margin: 0 0 8px; }
    .subtitle { color: #5f6368; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { font-size: 14px; color: #202124; display: block; margin-bottom: 8px; }
    input { width: 100%; padding: 12px 16px; font-size: 16px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; }
    input:focus { border-color: #1a73e8; outline: none; }
    button { background: #1a73e8; color: #fff; padding: 12px 24px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; float: right; }
    .help-link { font-size: 14px; color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <!--
    Expected Detection:
    - Field: #verificationCode (input with inputmode="numeric" + maxlength)
    - Confidence: 95
    - Tier: 1
    - Signals: inputmode="numeric", maxlength=6
    - Rationale: Strong Tier 1 signals with clean semantic structure
  -->
  <div class="card">
    <div class="logo">
      <svg width="75" height="24" viewBox="0 0 75 24"><path fill="#4285F4" d="M0 0h75v24H0z"/></svg>
    </div>

    <h1>2-Step Verification</h1>
    <p class="subtitle">To continue to Gmail</p>

    <form>
      <div class="form-group">
        <label for="verificationCode">Enter the code</label>
        <input
          type="text"
          id="verificationCode"
          name="verificationCode"
          inputmode="numeric"
          maxlength="6"
          placeholder="6-digit code"
          required
          data-testid="verification-field"
        />
      </div>

      <p style="font-size: 13px; color: #5f6368; margin-bottom: 24px;">
        Google sent a code to your phone ending in ••37
      </p>

      <a href="#" class="help-link">Try another way</a>
      <button type="submit">Next</button>
    </form>
  </div>
</body>
</html>
