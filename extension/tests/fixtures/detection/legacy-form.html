<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Secure Login - Security Code Required</title>
  <style>
    body { font-family: Verdana, Geneva, sans-serif; background-color: #e8e8e8; margin: 0; padding: 20px; }
    table { background-color: #ffffff; border: 2px solid #003366; margin: 30px auto; padding: 0; }
    td { padding: 10px; }
    .header { background-color: #003366; color: #ffffff; font-size: 18px; font-weight: bold; padding: 15px; text-align: center; }
    .label { font-weight: bold; font-size: 12px; color: #333333; }
    .input { border: 1px solid #999999; padding: 5px; font-size: 14px; width: 200px; }
    .button { background-color: #003366; color: #ffffff; border: none; padding: 8px 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .note { font-size: 11px; color: #666666; font-style: italic; }
  </style>
</head>
<body>
  <!--
    Expected Detection:
    - Field: input[name="seccode"] (name contains "code")
    - Confidence: 85-90 (Tier 1)
    - Tier: 1
    - Signals: name="seccode" matches pattern
    - Rationale: Old HTML but name attribute still triggers Tier 1
  -->
  <form name="loginform" method="post" action="/verify">
    <table width="450" cellpadding="0" cellspacing="0" align="center">
      <tr>
        <td colspan="2" class="header">SECURITY CODE VERIFICATION</td>
      </tr>
      <tr>
        <td colspan="2" style="padding: 15px;">
          <p style="margin: 0; font-size: 12px;">
            For your security, a verification code has been sent to your registered email address.
            Please enter the security code below to proceed with login.
          </p>
        </td>
      </tr>
      <tr>
        <td width="150" class="label">Security Code:</td>
        <td>
          <input
            type="text"
            name="seccode"
            size="20"
            maxlength="8"
            class="input"
            data-testid="verification-field"
          />
        </td>
      </tr>
      <tr>
        <td colspan="2" class="note" style="padding-left: 10px;">
          * Code is case-sensitive and valid for 15 minutes
        </td>
      </tr>
      <tr>
        <td colspan="2" align="center" style="padding-top: 20px;">
          <input type="submit" value="SUBMIT CODE" class="button" />
        </td>
      </tr>
      <tr>
        <td colspan="2" align="center" style="padding-top: 10px;">
          <a href="#" style="font-size: 11px; color: #003366;">Resend Code</a> |
          <a href="#" style="font-size: 11px; color: #003366;">Contact Support</a>
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
