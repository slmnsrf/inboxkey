<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter code - Venmo</title>
</head>
<body>
    <div class="venmo-container">
        <div class="venmo-card">
            <h1>Enter your code</h1>
            <p class="description">
                Check your texts. We sent you a code to verify it's really you.
            </p>
            <form method="POST" action="/account/mfa/code-verify">
                <div class="form-field">
                    <!-- Detection signals: autocomplete="one-time-code", inputmode="numeric", id="code" -->
                    <label for="code">Code</label>
                    <input
                        type="text"
                        id="code"
                        name="code"
                        class="text-input"
                        autocomplete="one-time-code"
                        inputmode="numeric"
                        maxlength="6"
                        placeholder="000000"
                        required
                        autofocus
                    >
                </div>
                <button type="submit" class="button-primary button-large">Next</button>
            </form>
            <div class="footer-link">
                <a href="/account/mfa/resend">Resend code</a>
            </div>
        </div>
    </div>
</body>
</html>
