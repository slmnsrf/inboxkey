<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zendesk - Authentication</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9f9; margin: 0; padding: 20px; }
        .zendesk-container { max-width: 460px; margin: 50px auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 40px; }
        .zendesk-logo { text-align: center; margin-bottom: 30px; font-size: 28px; font-weight: 600; color: #03363d; }
        .zendesk-title { color: #2f3941; font-size: 24px; margin-bottom: 12px; font-weight: 600; }
        .zendesk-text { color: #68737d; line-height: 1.7; margin-bottom: 25px; }
        .zendesk-form-group { margin-bottom: 20px; }
        .zendesk-label { display: block; color: #2f3941; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .zendesk-input { width: 100%; padding: 12px; border: 1px solid #d8dcde; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        .zendesk-input:focus { border-color: #03363d; outline: none; box-shadow: 0 0 0 3px rgba(3, 54, 61, 0.1); }
        .zendesk-button { width: 100%; padding: 14px; background: #03363d; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .zendesk-button:hover { background: #02292f; }
    </style>
</head>
<body>
    <!-- Detection Signals: SaaS domain: zendesk, support platform -->
    <div class="zendesk-container">
        <div class="zendesk-logo">Zendesk</div>
        <h1 class="zendesk-title">Authentication Required</h1>
        <p class="zendesk-text">Enter the verification code we sent to your device.</p>
        <form id="authForm" action="/auth/verify" method="POST">
            <div class="zendesk-form-group">
                <label for="authCode" class="zendesk-label">Verification Code</label>
                <input type="tel" id="authCode" name="auth_code" class="zendesk-input" placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required />
            </div>
            <button type="submit" class="zendesk-button">Verify</button>
        </form>
    </div>
</body>
</html>
