<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify your identity - X</title>
</head>
<body>
    <div id="react-root">
        <main role="main">
            <div class="r-13qz1uu">
                <div class="css-1dbjc4n r-1awozwy">
                    <h1 class="css-4rbku5">Verify your identity</h1>
                    <span class="css-901oao">
                        We sent a code to your authenticator app. Enter it below to verify your identity.
                    </span>
                    <form method="POST">
                        <div class="css-1dbjc4n r-18u37iz">
                            <!-- Detection signals: autocomplete="one-time-code", inputmode="numeric", name="challenge_response" -->
                            <label class="css-1dbjc4n r-1awozwy">
                                <div class="css-901oao">Verification code</div>
                                <input
                                    type="text"
                                    name="challenge_response"
                                    class="r-30o5oe r-1niwhzg r-17gur6a"
                                    autocomplete="one-time-code"
                                    inputmode="numeric"
                                    maxlength="6"
                                    dir="auto"
                                    required
                                >
                            </label>
                        </div>
                        <div role="button" tabindex="0" class="css-18t94o4">
                            <button type="submit" class="css-901oao r-1awozwy">
                                <span>Verify</span>
                            </button>
                        </div>
                    </form>
                    <div class="css-1dbjc4n">
                        <a href="/account/login_challenge/recovery" role="link">
                            <span class="css-901oao">Use backup code</span>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
