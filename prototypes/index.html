<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InboxKey Prototypes</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-system);
      background: var(--surface-page);
      color: var(--color-text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ============================
       SIDEBAR
       ============================ */

    .sidebar {
      width: 260px;
      min-width: 260px;
      height: 100vh;
      background: var(--surface-card);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: var(--space-5) var(--space-5) var(--space-4);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .sidebar-logo-icon {
      width: 28px;
      height: 28px;
      background: var(--color-primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-sm);
      flex-shrink: 0;
    }

    .sidebar-logo h1 {
      margin: 0;
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--letter-spacing-tight);
    }

    .sidebar-subtitle {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      letter-spacing: var(--letter-spacing-wide);
      text-transform: uppercase;
      font-weight: var(--font-weight-medium);
    }

    .sidebar-controls {
      padding: var(--space-3) var(--space-5);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    /* ============================
       THEME TOGGLE
       ============================ */

    .theme-toggle {
      display: flex;
      background: var(--surface-page);
      border-radius: var(--radius-md);
      padding: 2px;
      gap: 2px;
    }

    .theme-toggle button {
      flex: 1;
      padding: var(--space-1) var(--space-2);
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text-tertiary);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      font-family: var(--font-system);
      cursor: pointer;
      transition: all var(--duration-fast) var(--easing-default);
    }

    .theme-toggle button[aria-pressed="true"] {
      background: var(--surface-card);
      color: var(--color-text-primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle button:hover:not([aria-pressed="true"]) {
      color: var(--color-text-secondary);
    }

    /* ============================
       NAV LIST
       ============================ */

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-3) 0;
    }

    .nav-category {
      padding: var(--space-2) var(--space-5) var(--space-1);
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-tertiary);
      letter-spacing: var(--letter-spacing-wider);
      text-transform: uppercase;
      margin-top: var(--space-2);
    }

    .nav-category:first-child {
      margin-top: 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-5);
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: all var(--duration-fast) var(--easing-default);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--font-system);
    }

    .nav-item:hover {
      background: var(--surface-page);
      color: var(--color-text-primary);
    }

    .nav-item.active {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: var(--font-weight-medium);
    }

    .nav-item-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    .nav-item.active .nav-item-icon {
      opacity: 1;
    }

    .nav-item-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item-status {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      font-weight: var(--font-weight-medium);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }

    .nav-item-status[data-status="ideation"] {
      background: var(--color-warning-light);
      color: var(--color-warning-dark);
    }

    .nav-item-status[data-status="approved"] {
      background: var(--color-success-light);
      color: var(--color-success-dark);
    }

    .nav-item-status[data-status="implemented"] {
      background: var(--color-primary-light);
      color: var(--color-primary);
    }

    .nav-item-status[data-status="archived"] {
      background: var(--color-gray-200);
      color: var(--color-text-tertiary);
    }

    /* ============================
       SIDEBAR FOOTER
       ============================ */

    .sidebar-footer {
      padding: var(--space-3) var(--space-5);
      border-top: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .proto-count {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }

    /* ============================
       MAIN CONTENT
       ============================ */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Welcome state */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      color: var(--color-text-tertiary);
      padding: var(--space-8);
    }

    .welcome-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      background: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-icon svg {
      width: 24px;
      height: 24px;
      color: var(--color-primary);
    }

    .welcome h2 {
      margin: 0;
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }

    .welcome p {
      margin: 0;
      font-size: var(--font-size-sm);
      max-width: 320px;
      text-align: center;
      line-height: var(--line-height-normal);
    }

    .shortcut-hint {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }

    kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      background: var(--surface-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-system);
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      box-shadow: 0 1px 0 var(--color-border);
    }

    /* Preview iframe */
    .preview-frame {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      display: none;
      background: var(--surface-page);
    }

    .preview-frame.visible {
      display: block;
    }

    /* ============================
       KEYBOARD NAV FOCUS
       ============================ */

    .nav-item:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 2px var(--color-primary);
      border-radius: var(--radius-sm);
    }

    .theme-toggle button:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring-shadow);
    }

    /* ============================
       REDUCED MOTION
       ============================ */

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 0ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" role="navigation" aria-label="Prototype navigation">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon" aria-hidden="true">IK</div>
        <h1>Prototypes</h1>
      </div>
      <span class="sidebar-subtitle">Design Explorations</span>
    </div>

    <div class="sidebar-controls">
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" aria-pressed="true" data-theme-btn="light" onclick="setTheme('light')">Light</button>
        <button type="button" aria-pressed="false" data-theme-btn="dark" onclick="setTheme('dark')">Dark</button>
      </div>
    </div>

    <nav class="sidebar-nav" id="nav">
      <!-- Popup -->
      <div class="nav-category">Popup</div>
      <button class="nav-item" data-src="popup/popup.html" data-status="ideation" onclick="loadProto(this)">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        <span class="nav-item-label">Popup Panel</span>
        <span class="nav-item-status" data-status="ideation">Ideation</span>
      </button>

      <!-- Content -->
      <div class="nav-category">Content Script</div>
      <button class="nav-item" data-src="content/field-chip.html" data-status="ideation" onclick="loadProto(this)">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-item-label">Field Chip</span>
        <span class="nav-item-status" data-status="ideation">Ideation</span>
      </button>
      <button class="nav-item" data-src="content/field-chip-subtle.html" data-status="ideation" onclick="loadProto(this)">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="m4.93 19.07 2.83-2.83"/><path d="m16.24 7.76 2.83-2.83"/></svg>
        <span class="nav-item-label">Field Chip (Subtle)</span>
        <span class="nav-item-status" data-status="ideation">Ideation</span>
      </button>

      <!-- Settings -->
      <div class="nav-category">Settings</div>
      <button class="nav-item" data-src="settings/main-settings.html" data-status="ideation" onclick="loadProto(this)">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="nav-item-label">Settings Tab</span>
        <span class="nav-item-status" data-status="ideation">Ideation</span>
      </button>
      <button class="nav-item" data-src="settings/accounts.html" data-status="ideation" onclick="loadProto(this)">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-item-label">Accounts Panel</span>
        <span class="nav-item-status" data-status="ideation">Ideation</span>
      </button>
      <button class="nav-item" data-src="settings/security.html" data-status="ideation" onclick="loadProto(this)">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span class="nav-item-label">Security Tab</span>
        <span class="nav-item-status" data-status="ideation">Ideation</span>
      </button>
      <button class="nav-item" data-src="settings/about.html" data-status="ideation" onclick="loadProto(this)">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span class="nav-item-label">About Tab</span>
        <span class="nav-item-status" data-status="ideation">Ideation</span>
      </button>

      <!-- Components -->
      <div class="nav-category">Components</div>
      <button class="nav-item" data-src="components/automation-level-indicators.html" data-status="ideation" onclick="loadProto(this)">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-6"/><path d="M6 20v-4"/><path d="M18 20V10"/></svg>
        <span class="nav-item-label">Automation Levels</span>
        <span class="nav-item-status" data-status="ideation">Ideation</span>
      </button>
      <button class="nav-item" data-src="components/provider-logos.html" data-status="ideation" onclick="loadProto(this)">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="nav-item-label">Provider Logos</span>
        <span class="nav-item-status" data-status="ideation">Ideation</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <span class="proto-count">9 prototypes</span>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      </div>
      <h2>Select a prototype</h2>
      <p>Pick a design from the sidebar to preview it here. Each prototype is a standalone HTML file with its own theme toggle and design decisions.</p>
      <div class="shortcut-hint">
        <kbd>&#8593;</kbd><kbd>&#8595;</kbd> to navigate
        <kbd>Enter</kbd> to select
      </div>
    </div>
    <iframe class="preview-frame" id="preview" title="Prototype preview" sandbox="allow-scripts allow-same-origin"></iframe>
  </main>

  <script>
    const preview = document.getElementById('preview');
    const welcome = document.getElementById('welcome');
    const navItems = document.querySelectorAll('.nav-item');
    let activeItem = null;

    function loadProto(btn) {
      const src = btn.getAttribute('data-src');

      // Update active state
      navItems.forEach(item => item.classList.remove('active'));
      btn.classList.add('active');
      activeItem = btn;

      // Show iframe, hide welcome
      welcome.style.display = 'none';
      preview.classList.add('visible');
      preview.src = src;
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);

      // Update toggle buttons
      document.querySelectorAll('[data-theme-btn]').forEach(btn => {
        btn.setAttribute('aria-pressed', btn.getAttribute('data-theme-btn') === theme);
      });

      // Sync theme to iframe if loaded
      if (preview.contentDocument && preview.contentDocument.documentElement) {
        preview.contentDocument.documentElement.setAttribute('data-theme', theme);
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      const items = Array.from(navItems);
      const currentIndex = activeItem ? items.indexOf(activeItem) : -1;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const next = items[currentIndex + 1] || items[0];
        next.focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prev = items[currentIndex - 1] || items[items.length - 1];
        prev.focus();
      } else if (e.key === 'Enter' && document.activeElement.classList.contains('nav-item')) {
        loadProto(document.activeElement);
      }
    });

    // Sync theme to iframe after it loads
    preview.addEventListener('load', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (preview.contentDocument && preview.contentDocument.documentElement) {
        preview.contentDocument.documentElement.setAttribute('data-theme', currentTheme);
      }
    });

    // Respect system preference on load
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setTheme('dark');
    }
  </script>

</body>
</html>
